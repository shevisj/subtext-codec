[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "subtext-codec"
version = "1.1.0"
description = "Steganographic data encoding in LLM-generated text via arithmetic coding against the model's own next-token distribution."
readme = "README.md"
authors = [{ name = "Shevis Johnson" , email = "hello@shev.is" }]
requires-python = ">=3.10"
dependencies = [
    # Lower bounds only. Pinning exact versions in a library makes it
    # uninstallable alongside anything else that depends on torch; the codec
    # only needs a working causal LM forward pass with a KV cache.
    # transformers >= 4.56 is required for the `dtype=` argument to
    # `from_pretrained` (`torch_dtype` is deprecated and removed in 5.x).
    "torch>=2.1",
    "transformers>=4.56",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
subtext-codec = "subtext_codec.cli:main"
subtext = "subtext_codec.cli:main"

[project.urls]
Homepage = "https://github.com/shevisj/subtext-codec"
Repository = "https://github.com/shevisj/subtext-codec"
Issues = "https://github.com/shevisj/subtext-codec/issues"

[tool.hatch.build.targets.wheel]
packages = ["subtext_codec"]

[tool.pytest.ini_options]
markers = [
    "slow: requires downloading and running a real model",
]
testpaths = ["tests"]
