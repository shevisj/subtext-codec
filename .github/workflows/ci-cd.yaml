name: "CI/CD"

on:
  push:
    branches: [main]
    tags:
      # Publish on any tag starting with a `v`, e.g., v0.1.0
      - v*
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (see requires-python) and newest stable.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # Pinned to a full version: setup-uv stopped publishing floating major
        # tags in v8, so `@v10` does not resolve.
        uses: astral-sh/setup-uv@v10.0.0
        with:
          # "auto" caches on normal pushes and PRs but not on tag pushes and
          # other privileged events, which is the cache-poisoning guard added
          # in setup-uv v10. Do not force this to "true" to shave a minute off
          # release runs.
          enable-cache: auto
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        # CPU wheels only; the tests never need a GPU.
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            torch transformers pytest
          uv pip install --no-deps -e .
      - name: Test
        # Invoke the venv directly rather than via `uv run`, which may re-sync
        # from PyPI and replace the CPU torch wheel with the CUDA one.
        # The slow tests download a small checkpoint from the Hub; they skip
        # themselves if it is unreachable.
        run: .venv/bin/python -m pytest -q

  pypi-publish:
    name: Upload release to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/subtext-codec/
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # Pinned to a full version: setup-uv stopped publishing floating major
        # tags in v8, so `@v10` does not resolve.
        uses: astral-sh/setup-uv@v10.0.0
      - name: Set up Python
        run: uv python install 3.14
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish
